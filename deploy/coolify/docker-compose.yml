services:
  agentmemory:
    build:
      context: ../..
      dockerfile: deploy/coolify/Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.22"
        III_VERSION: "0.11.2"
        III_SDK_VERSION: "0.11.2"
    restart: unless-stopped
    environment:
      SERVICE_FQDN_AGENTMEMORY_3111: ${SERVICE_FQDN_AGENTMEMORY_3111}
      SERVICE_FQDN_AGENTMEMORY_3113: ${SERVICE_FQDN_AGENTMEMORY_3113}
      AGENTMEMORY_TOOLS: all
      VIEWER_ALLOWED_HOSTS: ${VIEWER_ALLOWED_HOSTS:-memory-viewer.domenpashin.shop,memory-viewer.domenpashin.shop:443}
      VIEWER_ALLOWED_ORIGINS: ${VIEWER_ALLOWED_ORIGINS:-https://memory-viewer.domenpashin.shop,https://memory.domenpashin.shop}
      # Pass Dokploy/Coolify UI secrets through to the container (required —
      # vars set only in the dashboard are not injected unless listed here).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FOR_LLM: ${OPENAI_API_KEY_FOR_LLM:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      GRAPH_EXTRACTION_ENABLED: ${GRAPH_EXTRACTION_ENABLED:-false}
      CONSOLIDATION_ENABLED: ${CONSOLIDATION_ENABLED:-}
      AGENTMEMORY_AUTO_COMPRESS: ${AGENTMEMORY_AUTO_COMPRESS:-}
      AGENTMEMORY_INJECT_CONTEXT: ${AGENTMEMORY_INJECT_CONTEXT:-}
    expose:
      - "3111"
      - "3113"
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentmemory-data:
