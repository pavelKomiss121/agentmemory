services:
  agentmemory:
    build: .
    container_name: agentmemory
    restart: unless-stopped

    ports:
      - "3111:3111"
      - "3112:3112"
      - "3113:3113"

    environment:
      NODE_ENV: production
      AGENTMEMORY_USE_DOCKER: "1"
      AGENTMEMORY_SECRET: "замени_на_секрет"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agentmemory_data:/root/.agentmemory
      - agentmemory_iii:/data

volumes:
  agentmemory_data:
  agentmemory_iii:
