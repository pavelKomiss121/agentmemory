services:
  agentmemory:
    image: node:20
    container_name: agentmemory
    restart: unless-stopped

    command: >
      bash -c "
        npm install -g --force @agentmemory/agentmemory@latest &&
        AGENTMEMORY_USE_DOCKER=1 agentmemory
      "

    ports:
      - "3111:3111"
      - "3112:3112"
      - "3113:3113"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agentmemory_data:/root/.agentmemory
      - agentmemory_iii:/data

    environment:
      - AGENTMEMORY_SECRET=твoй_секрет_32_символа
      - NODE_ENV=production
      - AGENTMEMORY_HOST=0.0.0.0
      - AGENTMEMORY_USE_DOCKER=1

volumes:
  agentmemory_data:
  agentmemory_iii:
