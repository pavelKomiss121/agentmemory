version: '3.8'

services:
  agentmemory:
    image: node:20-slim
    container_name: agentmemory
    restart: unless-stopped
    command: >
      sh -c "npm install -g @agentmemory/agentmemory && 
             agentmemory"
    ports:
      - "3111:3111"    # Основной API
      - "3113:3113"    # Viewer (можно убрать или оставить только локально)
      - "3112:3112"    # Streams
    volumes:
      - agentmemory_data:/root/.agentmemory
      - agentmemory_iii:/data               # Важно для iii-engine
    environment:
      - AGENTMEMORY_SECRET=твой_очень_длинный_секрет_здесь
      - NODE_ENV=production
      # При желании добавь LLM-ключи позже:
      # - ANTHROPIC_API_KEY=...
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3111/agentmemory/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  agentmemory_data:
  agentmemory_iii:
