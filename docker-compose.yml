services:
  agentmemory:
    image: node:20
    container_name: agentmemory
    restart: unless-stopped

    network_mode: host

    command: >
      bash -c "
        npm install -g --force @agentmemory/agentmemory@latest &&
        AGENTMEMORY_USE_DOCKER=1 agentmemory --port 3111
      "

    environment:
      NODE_ENV: production
      AGENTMEMORY_USE_DOCKER: "1"
      AGENTMEMORY_SECRET: "замени_на_длинный_секрет"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agentmemory_data:/root/.agentmemory
      - agentmemory_iii:/data

volumes:
  agentmemory_data:
  agentmemory_iii:
