version: '3.8'

services:
  agentmemory:
    image: node:20-alpine
    container_name: agentmemory
    restart: unless-stopped
    command: >
      sh -c "npm install -g @agentmemory/agentmemory@latest &&
             agentmemory"
    ports:
      - "3111:3111"   # Основной API (обязательно)
      - "3113:3113"   # Viewer (можно оставить или убрать)
      - "3112:3112"   # Streams
    volumes:
      - agentmemory_data:/root/.agentmemory
      - agentmemory_iii:/data
    environment:
      - AGENTMEMORY_SECRET=${AGENTMEMORY_SECRET:-superlongrandomsecret1234567890}
      - NODE_ENV=production
      - AGENTMEMORY_HOST=0.0.0.0
      # Добавь позже, если нужно:
      # - ANTHROPIC_API_KEY=...
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3111/agentmemory/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  agentmemory_data:
    name: agentmemory_data
  agentmemory_iii:
    name: agentmemory_iii
